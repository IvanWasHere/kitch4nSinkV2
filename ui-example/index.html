/* ---- behaviour ---- */
function pnRenderPrices(){ $('#pn-prices').innerHTML = draft.prices.map(pnPriceHtml).join(''); icons(); pnPreview(); }
function pnRenderImage(){ $('#pn-image').innerHTML = pnImageHtml(); icons(); pnPreview(); }
function pnRenderAppearance(){ $('#pn-appearance').innerHTML = pnAppearanceHtml(); icons(); pnPreview(); }
function pnRenderMeta(){ $('#pn-meta').innerHTML = pnMetaHtml(); icons(); }
function pnPreview(){ $('#pn-preview').innerHTML = prodCardHtml(previewProduct(), null, {preview:true}); icons(); }

function pnToPrice(p, i){
  const cents = toCents(p.amount);
  const price = {
    id: `price_${i+1}`,
    nick: p.nick.trim(),
    amount: Number.isFinite(cents) ? cents : 0,
    cur: p.cur,
    type: p.type
  };
  if (p.type === 'recurring'){
    price.interval = intervalLabel(p.interval);
    const t = toDays(p.trial);
    if (t) price.trial = t;
  }
  return price;
}

function pnReadImage(file){
  if (!file) return;
  if (!/^image\//.test(file.type)) return toast('That file isn’t an image','x');
  if (file.size > 2*1024*1024)    return toast('Images need to be under 2 MB','x');
  const fr = new FileReader();
  fr.onload = () => {
    draft.image = fr.result; draft.imageName = file.name; draft.imageSize = file.size;
    pnRenderImage();
    toast('Image added','image');
  };
  fr.onerror = () => toast('Could not read that file','x');
  fr.readAsDataURL(file);
}

function wireProductNew(){
  const form = $('#pn-form');

  const onEdit = e => {
    const t = e.target;
    if (t.dataset.pi !== undefined && t.dataset.f){
      const p = draft.prices[+t.dataset.pi];
      if (!p) return;
      p[t.dataset.f] = t.value;
      if (t.dataset.f === 'cur'){
        const sym = t.closest('.row2').querySelector('.cursym');
        if (sym) sym.textContent = curSym(t.value);
      }
    } else if (t.dataset.pf){
      draft[t.dataset.pf] = t.type === 'checkbox' ? t.checked : t.value;
    } else if (t.dataset.mi !== undefined){
      const m = draft.meta[+t.dataset.mi];
      if (m) m[t.dataset.mf] = t.value;
      return;                       /* metadata doesn't affect the preview */
    } else return;
    if (t.classList.contains('err')){          /* clear a validation error as soon as it's addressed */
      t.classList.remove('err');
      const fe = t.closest('.field').querySelector('.field-err');
      if (fe) fe.remove();
      delete draft.errs[t.dataset.pf === 'name' ? 'name' : 'amt' + t.dataset.pi];
    }
    pnPreview();
  };
  form.addEventListener('input', onEdit);
  form.addEventListener('change', onEdit);

  form.addEventListener('click', e => {
    const type = e.target.closest('[data-ptype]');
    if (type){
      const i = +type.dataset.pi;
      draft.prices[i].type = type.dataset.ptype;
      const item = type.closest('.price-item');
      $$('[data-ptype]', item).forEach(b => b.classList.toggle('on', b === type));
      const rec = $('.rec-only', item);
      if (rec) rec.style.display = type.dataset.ptype === 'recurring' ? '' : 'none';
      pnPreview();
      return;
    }
    const rmP = e.target.closest('[data-rm-price]');
    if (rmP){ draft.prices.splice(+rmP.dataset.rmPrice, 1); draft.errs = {}; pnRenderPrices(); return; }

    const ic = e.target.closest('[data-ic]');
    if (ic){ draft.icon = ic.dataset.ic; pnRenderAppearance(); return; }

    const tint = e.target.closest('[data-tint]');
    if (tint){ draft.tintIdx = +tint.dataset.tint; pnRenderAppearance(); return; }

    const rmM = e.target.closest('[data-rm-meta]');
    if (rmM){ draft.meta.splice(+rmM.dataset.rmMeta, 1); pnRenderMeta(); return; }

    if (e.target.closest('#pn-drop')) { $('#pn-file').click(); return; }
    if (e.target.closest('#pn-img-remove')){
      draft.image = null; draft.imageName = ''; draft.imageSize = 0;
      $('#pn-file').value = '';
      pnRenderImage();
      return;
    }
    if (e.target.closest('#pn-add-price')){
      if (draft.prices.length >= 5) return toast('Five prices is the limit for one product','info');
      draft.prices.push(blankPrice()); pnRenderPrices(); return;
    }
    if (e.target.closest('#pn-add-meta')){
      if (draft.meta.length >= 8) return toast('Eight metadata rows is the limit','info');
      draft.meta.push({k:'',v:''}); pnRenderMeta(); return;
    }
  });

  $('#pn-file').addEventListener('change', e => pnReadImage(e.target.files[0]));

  const imgBox = $('#pn-image');
  ['dragenter','dragover'].forEach(ev => imgBox.addEventListener(ev, e => {
    e.preventDefault(); const d = $('#pn-drop'); if (d) d.classList.add('over');
  }));
  ['dragleave','drop'].forEach(ev => imgBox.addEventListener(ev, e => {
    e.preventDefault(); const d = $('#pn-drop'); if (d) d.classList.remove('over');
  }));
  imgBox.addEventListener('drop', e => pnReadImage(e.dataTransfer.files && e.dataTransfer.files[0]));

  $('#pn-more').addEventListener('toggle', e => { draft.moreOpen = e.target.open; });
  $('#pn-save').addEventListener('click', saveNewProduct);
}

function saveNewProduct(){
  draft.errs = {};
  const name = draft.name.trim();
  if (!name) draft.errs.name = 'Give the product a name.';
  draft.prices.forEach((p, i) => {
    const c = toCents(p.amount);
    if (!Number.isFinite(c) || c <= 0) draft.errs['amt'+i] = 'Enter an amount greater than zero.';
  });

  if (Object.keys(draft.errs).length){
    render();
    const first = $('#pn-form .inp.err');
    if (first) first.focus();
    toast('Check the highlighted fields','alert-circle');
    return;
  }

  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24) || 'item';
  let id = draft.pid.trim() || `prod_${slug}`;
  while (DATA.products.some(p => p.id === id)) id = `${id}_${Math.random().toString(36).slice(2,5)}`;

  const meta = {};
  draft.meta.forEach(m => { if (m.k.trim()) meta[m.k.trim()] = m.v.trim(); });

  const product = {
    id, name,
    tagline: draft.tagline.trim(),
    icon: draft.icon,
    tint: PROD_TINTS[draft.tintIdx],
    image: draft.image,
    active: draft.active,
    prices: draft.prices.map((p, i) => ({ ...pnToPrice(p, i), id: `price_${slug}_${i+1}` })),
    match: [],
    descriptor: draft.descriptor.trim(),
    tax: draft.tax,
    metadata: meta
  };

  DATA.products.unshift(product);
  PROD_STATS[id] = { units:0, revenue:0, last:null };
  draft = blankDraft();
  state.prod.q = '';
  nav('products');
  toast(`${name} added to your catalogue`, 'check');
}

/* =========================================================
   Drawers — payment / customer / product, with back-stack
   ========================================================= */
function pushDrawer(type, id){
  if (state.drawer) state.stack.push(state.drawer);
  state.drawer = { type, id };
  state.payConfirm = false;
  document.body.style.overflow = 'hidden';
  renderDrawer();
}
const openPayment  = id => { state.sel = id; pushDrawer('payment', id); };
const openCustomer = email => pushDrawer('customer', email);
const openProduct  = pid => pushDrawer('product', pid);

function closeDrawer(){
  const root = $('#drawer-root');
  if (!root.firstChild) return;
  state.drawer = null; state.stack = []; state.payConfirm = false; state.sel = null;
  root.classList.add('closing');
  document.body.style.overflow = '';
  setTimeout(()=>{ root.innerHTML=''; root.classList.remove('closing'); }, 220);
  $$('#pay-body tr.p-row').forEach(t=>t.classList.remove('selected'));
}

function renderDrawer(){
  const root = $('#drawer-root');
  if (!state.drawer){ root.innerHTML=''; return; }
  root.innerHTML =
    state.drawer.type === 'payment'  ? paymentDrawerHtml() :
    state.drawer.type === 'customer' ? customerDrawerHtml() :
                                       productDrawerHtml();
  icons();
  wireDrawer();
}

function drawerShell(title, bodyHtml, footHtml){
  const back = state.stack.length
    ? `<button class="back-btn" id="dw-back" aria-label="Back"><i data-lucide="arrow-left"></i></button>` : '';
  return `
    <div class="overlay" id="dw-overlay"></div>
    <aside class="drawer" role="dialog">
      <div class="dw-head"><span class="dw-head-l">${back}<span>${title}</span></span>
        <button class="icon-btn" id="dw-close" aria-label="Close" style="width:30px;height:30px"><i data-lucide="x"></i></button></div>
      <div class="dw-body">${bodyHtml}</div>
      <div class="dw-foot">${footHtml}</div>
    </aside>`;
}

function paymentDrawerHtml(){
  const p = PAYMENTS.find(x => x.id === state.drawer.id);
  if (!p) return '';
  const net = p.amount - p.fee;
  const created = p.ts, done = p.ts + 2*60000;

  let timeline = `
    <div class="tl-item"><div class="tl-dot"></div><div>
      <div class="tl-title">Payment created</div><div class="tl-sub">${fdatetime(created)}</div></div></div>`;
  if (p.status === 'succeeded')
    timeline += `
    <div class="tl-item"><div class="tl-dot ok"></div><div>
      <div class="tl-title">Succeeded</div><div class="tl-sub">${fdatetime(done)}</div></div></div>
    <div class="tl-item"><div class="tl-dot"></div><div>
      <div class="tl-title">Estimated payout</div><div class="tl-sub">Funds arrive ${fdate(nextFriday(done))}</div></div></div>`;
  if (p.status === 'pending')
    timeline += `
    <div class="tl-item"><div class="tl-dot warn"></div><div>
      <div class="tl-title">Processing</div><div class="tl-sub">We'll update this payment as the issuer responds</div></div></div>`;
  if (p.status === 'failed')
    timeline += `
    <div class="tl-item"><div class="tl-dot bad"></div><div>
      <div class="tl-title">Failed — ${esc(FAIL_REASONS[p.failure] || 'declined')}</div>
      <div class="tl-sub">${fdatetime(done)}</div></div></div>`;
  if (p.status === 'refunded')
    timeline += `
    <div class="tl-item"><div class="tl-dot ok"></div><div>
      <div class="tl-title">Succeeded</div><div class="tl-sub">${fdatetime(done)}</div></div></div>
    <div class="tl-item"><div class="tl-dot"></div><div>
      <div class="tl-title">Refund issued</div><div class="tl-sub">${fdatetime(p.refundedAt)}</div></div></div>`;

  const rk = RISK[p.risk] || RISK.normal;
  const prod = findProductByDesc(p.desc);

  let actions = '';
  if (p.status === 'succeeded'){
    actions = state.payConfirm
      ? `<div class="confirm-strip">
           <span>Refund <b>${money(p.amount,p.currency)}</b> to ${esc(p.name)}?</span>
           <button class="btn btn-danger" id="dw-refund-yes">Refund payment</button>
           <button class="btn btn-secondary" id="dw-refund-no">Cancel</button>
         </div>`
      : `<button class="btn btn-secondary" id="dw-receipt"><i data-lucide="mail"></i>Send receipt</button>
         <button class="btn btn-danger" id="dw-refund"><i data-lucide="rotate-ccw"></i>Refund</button>`;
  } else if (p.status === 'pending'){
    actions = `<button class="btn btn-secondary" id="dw-receipt"><i data-lucide="mail"></i>Send receipt</button>`;
  } else if (p.status === 'failed'){
    actions = `<button class="btn btn-primary" id="dw-retry"><i data-lucide="rotate-ccw"></i>Retry payment</button>`;
  }

  const banner =
    p.status === 'failed'  ? `<div class="notice notice-red"><i data-lucide="alert-triangle"></i><span><b>Payment failed.</b> ${esc(FAIL_REASONS[p.failure]||'')} You can retry the charge.</span></div>` :
    p.status === 'pending' ? `<div class="notice notice-amber"><i data-lucide="clock"></i><span><b>Payment is processing.</b> This usually completes within a few minutes.</span></div>` :
    p.status === 'refunded'? `<div class="notice notice-gray"><i data-lucide="rotate-ccw"></i><span><b>Refunded.</b> ${money(p.amount,p.currency)} was returned to the customer's card.</span></div>` : '';

  const body = `
    <div class="dw-title">${esc(p.desc)}</div>
    <div class="dw-idrow"><span class="mono">${p.id}</span>
      <button class="copy" id="dw-copy" aria-label="Copy ID"><i data-lucide="copy"></i></button></div>
    <div class="dw-amount-row"><span class="dw-amount">${money(p.amount,p.currency)}</span>${stPill(p.status)}</div>
    ${banner}
    <div class="dw-sec">Timeline</div>
    <div class="timeline">${timeline}</div>
    <div class="dw-sec">Payment details</div>
    <div class="kv">
      <span class="k">Amount</span><span class="v">${money(p.amount,p.currency)}</span>
      <span class="k">Fee</span><span class="v">${money(p.fee,p.currency)}</span>
      <span class="k">Net</span><span class="v">${money(net,p.currency)}</span>
      <span class="k">Risk evaluation</span><span class="v"><span class="risk" style="color:${rk.c};background:${rk.b}">${rk.label}</span></span>
      <span class="k">Payment method</span>
      <span class="v">${brandSvg(p.brand,30)} •••• ${p.last4}<span class="sub-v">${p.brand.toUpperCase()} · ${p.country}</span></span>
      <span class="k">Customer</span>
      <span class="v"><button class="link" id="dw-cust">${esc(p.name)}</button><span class="sub-v">${esc(p.email)}</span></span>
      ${prod ? `<span class="k">Product</span><span class="v"><button class="link" id="dw-prod">${esc(prod.name)}</button></span>` : ''}
      <span class="k">Statement descriptor</span><span class="v">LUMEN LABS</span>
    </div>`;

  return drawerShell('Payment', body, actions);
}

function customerDrawerHtml(){
  const c = getCustomers().find(x => x.email === state.drawer.id);
  if (!c) return '';
  const t = tintOf(c.email);
  const theirs = PAYMENTS.filter(p => p.email === c.email).sort((a,b)=>b.ts-a.ts);
  const body = `
    <div class="dw-hero">
      <div class="avatar-sm lg" style="background:${t[0]};color:${t[1]}">${initialsOf(c.name)}</div>
      <div><div class="dw-title">${esc(c.name)}</div>
        <div class="dw-idrow" style="margin-top:3px">${esc(c.email)}</div></div>
    </div>
    <div class="dw-sec">Summary</div>
    <div class="kv">
      <span class="k">Customer since</span><span class="v">${new Date(c.first).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</span>
      <span class="k">Lifetime spend</span><span class="v">${money(c.spend)}</span>
      <span class="k">Payments</span><span class="v">${c.count}${c.failed?` <span style="color:var(--red-t);font-weight:400">· ${c.failed} failed</span>`:''}</span>
      <span class="k">Last payment</span><span class="v">${fago(c.last)}</span>
    </div>
    <div class="dw-sec">Payment history</div>
    <div style="margin:0 -24px">
      ${theirs.map(p=>`
        <div class="list-row" data-open-pay="${p.id}" style="padding:10px 24px">
          ${stDot(p.status)}
          <span class="list-amt">${money(p.amount,p.currency)}</span>
          <span class="list-desc">${esc(p.desc)}</span>
          <span class="list-meta">${fago(p.ts)} <i data-lucide="chevron-right" class="lucide chev"></i></span>
        </div>`).join('')}
    </div>`;
  return drawerShell('Customer', body,
    `<button class="btn btn-secondary" id="dw-email"><i data-lucide="mail"></i>Email customer</button>`);
}

function productDrawerHtml(){
  const pr = DATA.products.find(x => x.id === state.drawer.id);
  if (!pr) return '';
  const st = PROD_STATS[pr.id];
  const theirs = PAYMENTS.filter(p => pr.match.includes(p.desc)).sort((a,b)=>b.ts-a.ts).slice(0,4);
  const body = `
    <div class="dw-hero">
      ${prodMedia(pr, 46)}
      <div style="flex:1;min-width:0"><div class="dw-title">${esc(pr.name)}</div>
        <div style="font-size:12.5px;color:var(--ink-3);margin-top:2px">${pr.active ? 'Active' : 'Inactive'} · ${pr.prices.length} price${pr.prices.length>1?'s':''}</div></div>
      <label class="switch"><input type="checkbox" id="pd-active" ${pr.active?'checked':''}><span></span></label>
    </div>
    <div style="font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:12px">${esc(pr.tagline)}</div>
    <div class="dw-sec">Sales</div>
    <div class="kv">
      <span class="k">Units sold</span><span class="v">${st.units}</span>
      <span class="k">Gross revenue</span><span class="v">${st.units ? money(st.revenue) : '—'}</span>
      <span class="k">Last sold</span><span class="v">${st.last ? fago(st.last) : 'Never'}</span>
    </div>
    <div class="dw-sec">Prices</div>
    <div>${pr.prices.map(pc => priceLine(pc, true)).join('')}</div>
    <div class="dw-sec">Recent payments</div>
    ${theirs.length ? `<div style="margin:0 -24px">${theirs.map(p=>`
      <div class="list-row" data-open-pay="${p.id}" style="padding:10px 24px">
        ${stDot(p.status)}
        <span class="list-amt">${money(p.amount,p.currency)}</span>
        <span class="list-desc">${esc(p.name)}</span>
        <span class="list-meta">${fago(p.ts)} <i data-lucide="chevron-right" class="lucide chev"></i></span>
      </div>`).join('')}</div>`
    : `<div class="notice notice-gray" style="margin:0"><i data-lucide="info"></i><span>No sales recorded for this product yet.</span></div>`}`;
  return drawerShell('Product', body,
    `<button class="btn btn-secondary" id="pd-view"><i data-lucide="credit-card"></i>View in Payments</button>`);
}

function wireDrawer(){
  $('#dw-overlay').addEventListener('click', closeDrawer);
  $('#dw-close').addEventListener('click', closeDrawer);
  const back = $('#dw-back');
  if (back) back.addEventListener('click', () => {
    state.drawer = state.stack.pop() || null;
    if (!state.drawer){ closeDrawer(); return; }
    renderDrawer();
  });

  const type = state.drawer.type;

  if (type === 'payment'){
    const p = PAYMENTS.find(x => x.id === state.drawer.id);
    $('#dw-copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(p.id); toast('Payment ID copied to clipboard','copy'); }
      catch { toast('Copy failed — clipboard unavailable','x'); }
    });
    const cust = $('#dw-cust');
    if (cust) cust.addEventListener('click', () => openCustomer(p.email));
    const prod = $('#dw-prod');
    if (prod){ const pr = findProductByDesc(p.desc); if (pr) prod.addEventListener('click', () => openProduct(pr.id)); }
    const receipt = $('#dw-receipt');
    if (receipt) receipt.addEventListener('click', () => toast(`Receipt emailed to ${p.email}`,'mail'));
    const refundBtn = $('#dw-refund');
    if (refundBtn) refundBtn.addEventListener('click', () => { state.payConfirm = true; renderDrawer(); });
    const noBtn = $('#dw-refund-no');
    if (noBtn) noBtn.addEventListener('click', () => { state.payConfirm = false; renderDrawer(); });
    const yesBtn = $('#dw-refund-yes');
    if (yesBtn) yesBtn.addEventListener('click', () => {
      p.status = 'refunded'; p.refundedAt = nowTs(); state.payConfirm = false;
      renderDrawer(); render();
      toast(`Refunded ${money(p.amount,p.currency)} to ${p.name}`,'rotate-ccw');
    });
    const retry = $('#dw-retry');
    if (retry) retry.addEventListener('click', () => {
      retry.disabled = true;
      retry.innerHTML = '<i data-lucide="clock"></i>Retrying…'; icons();
      setTimeout(() => {
        p.status = 'succeeded';
        renderDrawer(); render();
        toast('Payment succeeded','check');
      }, 1200);
    });
  }

  if (type === 'customer'){
    $('#dw-email').addEventListener('click', () => {
      const c = getCustomers().find(x => x.email === state.drawer.id);
      toast(`Draft email to ${c.email} opened`,'mail');
    });
    $$('[data-open-pay]', $('#drawer-root')).forEach(r =>
      r.addEventListener('click', () => openPayment(r.dataset.openPay)));
  }

  if (type === 'product'){
    const pr = DATA.products.find(x => x.id === state.drawer.id);
    $('#pd-active').addEventListener('change', e => {
      pr.active = e.target.checked;
      render();
      toast(pr.active ? `${pr.name} activated` : `${pr.name} deactivated`, pr.active ? 'check' : 'pause');
    });
    $('#pd-view').addEventListener('click', () => {
      closeDrawer();
      nav('payments', { q: pr.name.split(' ')[0] });
    });
    $$('[data-open-pay]', $('#drawer-root')).forEach(r =>
      r.addEventListener('click', () => openPayment(r.dataset.openPay)));
  }
}

/* =========================================================
   Topbar — global search, bell, avatar
   ========================================================= */
const gsInput = $('#gs-input'), gsPop = $('#search-pop');
let srActive = -1;

function globalSearch(q){
  srActive = -1;
  if (!q.trim()){ gsPop.classList.remove('open'); gsPop.innerHTML=''; return; }
  const s = q.toLowerCase();
  const prodHits = DATA.products.filter(p => p.name.toLowerCase().includes(s)).slice(0,2);
  const custHits = getCustomers().filter(c =>
    c.name.toLowerCase().includes(s) || c.email.toLowerCase().includes(s)).slice(0,2);
  const payHits = PAYMENTS.filter(p =>
    p.desc.toLowerCase().includes(s) || p.name.toLowerCase().includes(s) ||
    p.email.toLowerCase().includes(s) || p.id.toLowerCase().includes(s)).slice(0,5);

  const prodRow = p => `<div class="sr-row" data-sr-type="product" data-sr-id="${p.id}">
      ${p.image ? `<div class="sr-ic"><img src="${esc(p.image)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"></div>`
                : `<div class="sr-ic" style="background:${p.tint[0]};color:${p.tint[1]}"><i data-lucide="${p.icon}"></i></div>`}
      <div style="min-width:0;flex:1"><div class="sr-desc">${esc(p.name)}</div><div class="sr-email">Product</div></div>
    </div>`;
  const custRow = c => { const t = tintOf(c.email); return `<div class="sr-row" data-sr-type="customer" data-sr-id="${esc(c.email)}">
      <div class="avatar-sm" style="background:${t[0]};color:${t[1]}">${initialsOf(c.name)}</div>
      <div style="min-width:0;flex:1"><div class="sr-desc">${esc(c.name)}</div><div class="sr-email">${esc(c.email)}</div></div>
      <span class="sr-amt">${money(c.spend)}</span>
    </div>`; };
  const payRow = p => `<div class="sr-row" data-sr-type="payment" data-sr-id="${p.id}">
      ${stDot(p.status)}
      <div style="min-width:0;flex:1"><div class="sr-desc">${esc(p.desc)}</div><div class="sr-email">${esc(p.name)} · ${esc(p.email)}</div></div>
      <span class="sr-amt">${money(p.amount,p.currency)}</span>
    </div>`;

  const rowsHtml = [...prodHits.map(prodRow), ...custHits.map(custRow), ...payHits.map(payRow)].join('');
  gsPop.classList.add('open');
  gsPop.innerHTML = rowsHtml
    ? rowsHtml + `<div class="pop-foot"><button class="pop-link" id="sr-all">View all payments →</button></div>`
    : `<div class="sr-empty">No results for “${esc(q)}”</div>`;

  $$('.sr-row', gsPop).forEach(r => r.addEventListener('click', () => {
    const { srType, srId } = r.dataset;
    closePops();
    if (srType === 'product') openProduct(srId);
    else if (srType === 'customer') openCustomer(srId);
    else openPayment(srId);
  }));
  const all = $('#sr-all');
  if (all) all.addEventListener('click', () => nav('payments', { q }));
}
gsInput.addEventListener('input', () => globalSearch(gsInput.value));
gsInput.addEventListener('keydown', e => {
  const rows = $$('.sr-row', gsPop);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if (!rows.length) return;
    srActive = e.key==='ArrowDown' ? (srActive+1) % rows.length : (srActive-1+rows.length) % rows.length;
    rows.forEach((r,i)=>r.classList.toggle('active', i===srActive));
  }
  if (e.key === 'Enter'){
    const target = rows[Math.max(0,srActive)];
    if (target){
      const { srType, srId } = target.dataset;
      closePops(); gsInput.blur();
      if (srType === 'product') openProduct(srId);
      else if (srType === 'customer') openCustomer(srId);
      else openPayment(srId);
    }
  }
  if (e.key === 'Escape'){ closePops(); gsInput.blur(); }
});

function closePops(){ $$('.pop').forEach(p=>p.remove()); gsPop.classList.remove('open'); gsPop.innerHTML=''; }
document.addEventListener('click', e => {
  if (!e.target.closest('#gs-box') && !e.target.closest('.pop') && !e.target.closest('#bell-wrap') && !e.target.closest('#avatar-wrap'))
    closePops();
});

 $('#bell-btn').addEventListener('click', e => {
  e.stopPropagation();
  const existing = $('#bell-pop');
  closePops();
  if (existing) return;
  const pop = document.createElement('div');
  pop.className = 'pop'; pop.id = 'bell-pop';
  pop.innerHTML = `<div class="pop-head">Notifications</div>
    ${DATA.notifications.map(n=>`<div class="pop-row"><i data-lucide="${n.icon}" style="color:var(--ink-2);margin-top:2px"></i>
      <div><div>${esc(n.text)}</div><div class="sub">${fago(nowTs()-n.age_min*60000)}</div></div></div>`).join('')}
    <div class="pop-foot"><button class="pop-link" id="bell-clear">Mark all as read</button></div>`;
  $('#bell-wrap').appendChild(pop); icons();
  $('#bell-clear').addEventListener('click', () => { $('#bell-badge').style.display='none'; closePops(); });
});

 $('#avatar-btn').addEventListener('click', e => {
  e.stopPropagation();
  const existing = $('#avatar-pop');
  closePops();
  if (existing) return;
  const pop = document.createElement('div');
  pop.className = 'pop'; pop.id = 'avatar-pop';
  pop.innerHTML = `<div class="pop-head">${esc(DATA.account.user)}<div class="sub" style="font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px">${esc(DATA.account.email)}</div></div>
    <div class="pop-foot">
      <button class="pop-link" id="av-settings"><i data-lucide="settings" style="vertical-align:-3px;margin-right:8px"></i>Account settings</button>
      <button class="pop-link" id="av-signout"><i data-lucide="log-out" style="vertical-align:-3px;margin-right:8px"></i>Sign out</button>
    </div>`;
  $('#avatar-wrap').appendChild(pop); icons();
  $('#av-settings').addEventListener('click', () => { closePops(); toast('Account settings aren\u2019t part of this demo','info'); });
  $('#av-signout').addEventListener('click', () => { closePops(); toast('This dashboard runs on example data — nothing to sign out of','info'); });
});

/* Sidebar + wordmark navigation */
 $('.wordmark').addEventListener('click', e => { e.preventDefault(); nav('home'); });
 $('#sidebar').addEventListener('click', e => {
  const item = e.target.closest('[data-nav]');
  if (item) nav(item.dataset.nav);
});
 $('#sidebar').addEventListener('change', e => {
  if (e.target.id === 'test-toggle'){
    state.testMode = e.target.checked;
    $('#test-chip').classList.toggle('off', !state.testMode);
    toast(state.testMode ? 'Test mode on — showing example data' : 'Test mode hidden (example data only)', 'info');
  }
});
 $('#menu-btn').addEventListener('click', e => { e.stopPropagation(); document.body.classList.toggle('sb-open'); });
 $('#sb-backdrop').addEventListener('click', () => document.body.classList.remove('sb-open'));

/* Global keyboard shortcuts */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing){ e.preventDefault(); gsInput.focus(); gsInput.select(); }
  if (e.key === 'Escape'){
    if ($('#drawer-root').firstChild) closeDrawer();
    else closePops();
  }
});

let rzT;
window.addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => { if (state.page === 'home') drawBigChart(); }, 150);
});

/* Boot */
document.title = `Stripe Dashboard · ${DATA.account.business}`;
render();
icons();
</script>
