<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stripe Dashboard · Lumen Labs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23635bff'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='800' fill='white' text-anchor='middle'%3Es%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#f6f8fa; --surface:#fff;
  --border:#e3e8ee; --border-soft:#f0f2f5;
  --ink:#1a1f36; --ink-2:#4f566b; --ink-3:#8792a2;
  --accent:#635bff; --accent-deep:#4f47d8;
  --green-t:#217005; --green-b:#e0f2d3;
  --amber-t:#9a5b0a; --amber-b:#fcf0d3;
  --red-t:#a82050;  --red-b:#fbe3ec;
  --blue-t:#0b6bb8; --blue-b:#dff0fb;
  --gray-t:#4f566b; --gray-b:#eceff3;
  --topbar-h:58px; --sb-w:232px;
  --shadow-card:0 1px 2px rgba(18,28,53,.05);
  --shadow-pop:0 10px 32px rgba(15,25,50,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Instrument Sans',sans-serif; font-size:14px; color:var(--ink);
  background:var(--bg); -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font-family:inherit}
.lucide{width:16px;height:16px;flex-shrink:0}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- Shell ---------- */
#app{display:flex;min-height:calc(100vh - var(--topbar-h))}
#sidebar{
  width:var(--sb-w);flex-shrink:0;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));
  display:flex;flex-direction:column;padding:14px 12px 16px;gap:2px;
}
.sb-account{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;font-style:italic}
.sb-name{font-weight:600;font-size:14px;line-height:1.2}
.sb-sub{font-size:12px;color:var(--ink-3)}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;
  color:var(--ink-2);font-weight:500;text-align:left;width:100%;border:1px solid transparent;
}
.sb-item .lucide{width:15px;height:15px;color:var(--ink-3)}
.sb-item:hover{background:#eaeef3}
.sb-item.active{background:#fff;border-color:var(--border);box-shadow:var(--shadow-card);color:var(--ink)}
.sb-item.active .lucide{color:var(--accent)}
.sb-fill{flex:1}
.sb-test{display:flex;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid var(--border)}
.sb-test .t1{font-weight:600;font-size:13px}
.sb-test .t2{font-size:11.5px;color:var(--ink-3)}
.switch{position:relative;width:32px;height:18px;flex-shrink:0;cursor:pointer}
.switch input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;background:#cfd6df;border-radius:999px;transition:.18s}
.switch span::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(14px)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 20px 0 22px;position:sticky;top:0;z-index:50;
}
/* left slot of the header lines up with the sidebar column below it */
.tb-brand{display:flex;align-items:center;gap:12px;flex-shrink:0;width:calc(var(--sb-w) - 34px)} /* 22px pad + 12px gap => divider lands on the sidebar edge */
#menu-btn{display:none}
.wordmark{font-weight:700;font-size:19px;letter-spacing:-.03em;color:var(--accent);text-decoration:none;cursor:pointer}
.tb-div{width:1px;height:22px;background:var(--border);margin:0 2px}
.tb-section{font-size:13.5px;color:var(--ink-2)}
.test-chip{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--amber-t);
  background:var(--amber-b);border:1px solid #f3ddab;padding:2.5px 8px;border-radius:999px;white-space:nowrap}
.test-chip.off{display:none}
#gs-wrap{flex:1;display:flex;justify-content:center;position:relative}
#gs-box{position:relative;width:100%;max-width:440px}
#gs-input{
  width:100%;height:36px;border-radius:8px;border:1px solid transparent;background:var(--bg);
  padding:0 34px 0 34px;font-size:13.5px;color:var(--ink);
}
#gs-input:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,91,255,.12)}
#gs-box > .lucide{position:absolute;left:11px;top:10px;color:var(--ink-3)}
#gs-box kbd{
  position:absolute;right:8px;top:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);
  border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:#fff;
}
.tb-right{display:flex;align-items:center;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--bg)}
.badge-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.avatar{width:29px;height:29px;border-radius:50%;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;cursor:pointer;letter-spacing:.02em}
.tb-avatar-wrap{position:relative;margin-left:4px}

/* ---------- Popovers / search ---------- */
.pop{
  position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow-pop);z-index:70;min-width:280px;overflow:hidden;
  animation:popIn .16s ease;
}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}}
.pop-head{padding:12px 16px;border-bottom:1px solid var(--border-soft);font-weight:600;font-size:13px}
.pop-row{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border-soft);font-size:13px;align-items:flex-start}
.pop-row:last-child{border-bottom:none}
.pop-row .sub{color:var(--ink-3);font-size:12px;margin-top:2px}
.pop-foot{padding:10px 16px}
.pop-link{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.pop-link:hover{background:var(--bg);color:var(--ink)}
#search-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow-pop);z-index:70;overflow:hidden;display:none;animation:popIn .16s ease}
#search-pop.open{display:block}
.sr-row{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border-soft)}
.sr-row:hover,.sr-row.active{background:var(--bg)}
.sr-desc{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-email{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-amt{margin-left:auto;font-weight:600;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sr-empty{padding:22px;text-align:center;color:var(--ink-3);font-size:13px}
.sr-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr-ic .lucide{width:13px;height:13px}

/* ---------- View / cards ---------- */
#view{padding:26px 32px 64px;max-width:1180px;width:100%;margin:0 auto}
.page{animation:fadeUp .26s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
h1.page-title{font-size:23px;font-weight:600;letter-spacing:-.015em;margin:0}
.page-sub{color:var(--ink-3);font-size:13.5px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card)}
.card-pad{padding:18px 20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border-soft)}
.card-title{font-weight:600;font-size:14.5px}
.link{color:var(--accent);font-weight:500;font-size:13.5px;text-decoration:none;cursor:pointer;background:none;border:none;padding:0}
.link:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;
  font-weight:500;font-size:13.5px;border:1px solid transparent;white-space:nowrap}
.btn .lucide{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-deep)}
.btn-secondary{background:#fff;border-color:var(--border);box-shadow:var(--shadow-card)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:#fff;border-color:var(--border);color:var(--red-t)}
.btn-danger:hover{background:var(--red-b)}
.btn:disabled{opacity:.55;cursor:default}

/* ---------- Overview ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.stat-grid.cols4{grid-template-columns:repeat(4,1fr)}
.stat-card{padding:18px 20px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.stat-label{font-size:13px;color:var(--ink-2);font-weight:500}
.stat-value{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat-delta{font-size:12.5px;color:var(--ink-3);margin-top:7px;display:flex;align-items:center;gap:5px}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:600}
.delta .lucide{width:13px;height:13px}
.delta.up{color:var(--green-t)} .delta.down{color:var(--red-t)}
.ov-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-bottom:16px}
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:inline-flex;align-self:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:2px;gap:1px}
.seg button{padding:3px 9px;border-radius:999px;font-size:11.5px;line-height:16px;font-weight:600;letter-spacing:.01em;color:var(--ink-3);transition:color .12s ease,background .12s ease}
.seg button:hover{color:var(--ink-2)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 1.5px rgba(18,28,53,.08)}
.seg button.active:hover{color:var(--ink)}
.chart-head-l .lbl{font-size:13px;color:var(--ink-2);font-weight:500}
.chart-head-l .big{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.chart-head-l .asof{font-size:12px;color:var(--ink-3);margin-top:5px}
.legend{display:flex;gap:16px;justify-content:flex-end;font-size:12px;color:var(--ink-3);padding:10px 2px 0}
.legend i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--accent);border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dash{border-top-style:dashed;border-color:#a5aec0}
.chart-wrap{position:relative;height:262px}
.chart-tip{
  position:absolute;pointer-events:none;background:#23283f;color:#fff;border-radius:7px;padding:8px 11px;
  font-size:12px;line-height:1.5;box-shadow:0 6px 18px rgba(10,15,40,.28);display:none;white-space:nowrap;z-index:5;
}
.chart-tip b{font-size:13px}
.chart-tip .pv{color:#aab1cf}
.bal-sec{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 4px}
.bal-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0}
.bal-row .cur{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3)}
.bal-row .amt{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.bal-next{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:11px 12px;background:var(--bg);border-radius:8px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.share-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:4px 0 14px}
.share-bar span{height:100%}
.share-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px}
.share-row .n{color:var(--ink-2)}
.share-row .v{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
.swatch{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.list-row{display:flex;align-items:center;gap:14px;padding:11px 20px;border-top:1px solid var(--border-soft);cursor:pointer}
.list-row:hover{background:#f6f9fc}
.list-amt{font-weight:600;min-width:86px;font-variant-numeric:tabular-nums}
.list-desc{color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-meta{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12.5px}
.list-row .lucide.chev{color:#c1c8d4}

/* ---------- Status pills & badges ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--c);
  background:var(--b);padding:2.5px 10px;border-radius:999px;white-space:nowrap}
.st .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.st-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.risk{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px}
.type-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--ink-2);white-space:nowrap}

/* ---------- Tables ---------- */
.toolbar{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.pt-search{position:relative}
.pt-search .lucide{position:absolute;left:10px;top:9px;color:var(--ink-3);width:15px;height:15px}
.pt-search input{height:34px;width:280px;border-radius:8px;border:1px solid var(--border);background:var(--bg);
  padding:0 12px 0 32px;font-size:13.5px}
.pt-search input:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,91,255,.12)}
.pillset{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:999px;font-weight:500;color:var(--ink-2);font-size:13px;border:1px solid transparent}
.pill:hover{background:#eaeef3}
.pill.active{background:#eceaff;color:#4638cf;border-color:#cdc7ff}
.pill .cnt{color:var(--ink-3);font-weight:400;margin-left:3px;font-size:12px}
.pill.active .cnt{color:#7d74e8}
table.pay{width:100%;border-collapse:collapse}
table.pay th{font-size:12.5px;color:var(--ink-3);font-weight:500;text-align:left;padding:10px 16px;
  border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
table.pay th.sortable{cursor:pointer}
table.pay th.sortable:hover{color:var(--ink-2)}
table.pay th .lucide{width:12px;height:12px;vertical-align:-2px;margin-left:2px}
table.pay td{padding:11.5px 16px;border-bottom:1px solid var(--border-soft);font-size:13.5px;vertical-align:middle}
table.pay tr.p-row{cursor:pointer}
table.pay tr.p-row:hover{background:#f6f9fc}
table.pay tr.p-row.selected{background:#f4f5ff}
td.amount{font-weight:600;font-variant-numeric:tabular-nums}
td.date-cell{color:var(--ink-2);font-size:13px;white-space:nowrap}
tr.group-row td{padding:18px 16px 6px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-bottom:none}
tr.group-row + tr.p-row td{border-top:none}
.method-cell{white-space:nowrap;color:var(--ink-2)}
.method-cell svg{vertical-align:-5px;margin-right:7px}
.cust-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-cell{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th:last-child,td:last-child{width:30px;text-align:right;color:#c1c8d4}
.amount-neg{color:#b13b5c}
.tx-fee{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:1px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:13px;color:var(--ink-2)}
.pager-btns{display:flex;gap:4px}
.pg{min-width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:500}
.pg:hover:not(:disabled){background:#eaeef3}
.pg.active{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-card)}
.pg:disabled{opacity:.4;cursor:default}
.empty{padding:64px 20px;text-align:center}
.empty .ring{width:46px;height:46px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--ink-3)}
.empty h3{margin:0 0 5px;font-size:15px}
.empty p{margin:0 0 16px;color:var(--ink-3);font-size:13.5px}

table.plain{width:100%;border-collapse:collapse}
table.plain th{font-size:12.5px;color:var(--ink-3);font-weight:500;text-align:left;padding:10px 20px;border-bottom:1px solid var(--border)}
table.plain td{padding:12px 20px;border-bottom:1px solid var(--border-soft);font-size:13.5px}
table.plain tr:last-child td{border-bottom:none}
table.plain tr.clickable{cursor:pointer}
table.plain tr.clickable:hover{background:#f6f9fc}
.avatar-sm{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.avatar-sm.lg{width:46px;height:46px;font-size:15px}
.bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

/* ---------- Products ---------- */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px}
.prod-card{padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:box-shadow .15s}
.prod-card:hover{box-shadow:0 4px 14px rgba(15,25,50,.09)}
.prod-card.inactive{opacity:.6}
.prod-head{display:flex;align-items:flex-start;gap:11px}
.prod-ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prod-ic .lucide{width:18px;height:18px}
.prod-name{font-weight:600;font-size:14.5px;line-height:1.25;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.prod-tag{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.price-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border-soft);font-size:13px}
.price-row .amt{font-weight:600}
.price-row .per{color:var(--ink-3);font-size:12.5px;margin-left:4px}
.price-row .type-badge{margin-left:auto}
.prod-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--border-soft);font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between}
.prod-foot b{color:var(--ink-2);font-weight:600}

/* ---------- At a glance / daily & weekly ---------- */
.snap{display:grid;grid-template-columns:repeat(4,1fr)}
.snap-cell{padding:15px 20px 17px;border-left:1px solid var(--border-soft)}
.snap-cell:first-child{border-left:none}
.snap-lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.snap-val{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.snap-delta{font-size:12px;color:var(--ink-3);margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.snap-sub{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.bars-wrap{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;min-width:500px}
.bar-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;cursor:default}
.bar-val{font-size:11px;color:var(--ink-3);text-align:center;margin-bottom:5px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.bar-track{flex:1;display:flex;align-items:flex-end}
.bar-fill{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#7b73ff,#635bff);
  transform-origin:bottom;animation:barUp .5s cubic-bezier(.32,.72,.24,1) both}
@keyframes barUp{from{transform:scaleY(0)}}
.bar-col:hover .bar-fill{background:linear-gradient(180deg,#5a51ff,#4f47d8)}
.bar-fill.partial{background:repeating-linear-gradient(135deg,#c4c0ff,#c4c0ff 5px,#d8d5ff 5px,#d8d5ff 10px)}
.bar-col:hover .bar-fill.partial{background:repeating-linear-gradient(135deg,#b0abff,#b0abff 5px,#cbc7ff 5px,#cbc7ff 10px)}
.bar-lbl{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:9px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bar-col:hover .bar-lbl{color:var(--ink-2)}
.grain-sum{display:flex;gap:30px;flex-wrap:wrap;margin-top:18px;padding-top:15px;border-top:1px solid var(--border-soft)}
.grain-sum .gs-l{font-size:12px;color:var(--ink-3)}
.grain-sum .gs-v{font-weight:600;font-size:15.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.grain-sum .gs-v small{font-weight:400;font-size:12px;color:var(--ink-3);margin-left:4px}
.partial-key{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.partial-key i{width:11px;height:11px;border-radius:3px;display:inline-block;
  background:repeating-linear-gradient(135deg,#c4c0ff,#c4c0ff 4px,#d8d5ff 4px,#d8d5ff 8px)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Forms (Add product) ---------- */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.form-card{margin-bottom:16px}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.lbl{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.lbl .opt{color:var(--ink-3);font-weight:400}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.45}
.inp{width:100%;height:36px;border-radius:8px;border:1px solid var(--border);background:#fff;
  padding:0 11px;font-size:13.5px;color:var(--ink)}
textarea.inp{height:auto;min-height:76px;padding:9px 11px;line-height:1.5;resize:vertical;font-family:inherit}
select.inp{cursor:pointer;padding-left:8px}
.inp::placeholder{color:#a9b1bf}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,91,255,.12)}
.inp.err{border-color:#d5407a}
.inp.err:focus{box-shadow:0 0 0 3px rgba(213,64,122,.13)}
.field-err{color:var(--red-t);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:5px}
.field-err .lucide{width:13px;height:13px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:10px;align-items:start}
.row2.even{grid-template-columns:1fr 1fr}
.amt-wrap{position:relative}
.amt-wrap .cursym{position:absolute;left:11px;top:9px;color:var(--ink-3);font-size:13.5px;pointer-events:none}
.amt-wrap .inp{padding-left:25px;font-variant-numeric:tabular-nums}

.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice-op{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;
  border:1px solid var(--border);border-radius:9px;padding:11px 12px}
.choice-op:hover{border-color:#c6cdda}
.choice-op.on{border-color:var(--accent);background:#f8f7ff;box-shadow:0 0 0 1px var(--accent)}
.choice-op .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid #c4cbd7;background:#fff;
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.choice-op.on .ck{border-color:var(--accent);background:var(--accent)}
.choice-op.on .ck::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}
.choice-op .t{font-weight:600;font-size:13.5px;display:block}
.choice-op .d{font-size:12px;color:var(--ink-3);margin-top:2px;display:block;line-height:1.4}

.drop{border:1.5px dashed #ccd3de;border-radius:10px;padding:20px;text-align:center;cursor:pointer;
  background:var(--bg);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:#f8f7ff}
.drop .lucide{width:19px;height:19px;color:var(--ink-3)}
.drop .t{font-size:13px;font-weight:500;margin-top:8px}
.drop .t b{color:var(--accent)}
.drop .d{font-size:12px;color:var(--ink-3);margin-top:3px}
.img-prev{display:flex;gap:13px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:11px 12px}
.img-prev img{width:54px;height:54px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--bg)}
.img-prev .fn{font-weight:500;font-size:13px;word-break:break-all}
.img-prev .fs{font-size:12px;color:var(--ink-3);margin-top:2px}
.ic-pick{display:flex;gap:8px;flex-wrap:wrap}
.ic-op{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border-soft)}
.ic-op:hover{border-color:#c6cdda}
.ic-op.on{border-color:transparent;box-shadow:0 0 0 2px var(--accent)}
.ic-op .lucide{width:17px;height:17px}

.price-item{border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:12px;position:relative}
.price-item:last-child{margin-bottom:0}
.price-item .idx{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:12px}
.price-item .rm{position:absolute;top:9px;right:9px;width:27px;height:27px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.price-item .rm:hover{background:var(--red-b);color:var(--red-t)}
.price-item .rm .lucide{width:14px;height:14px}

.meta-row{display:grid;grid-template-columns:1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:8px}
.meta-row .rm{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.meta-row .rm:hover{background:var(--red-b);color:var(--red-t)}
.meta-row .rm .lucide{width:14px;height:14px}
details.more summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);
  list-style:none;display:flex;align-items:center;gap:7px}
details.more summary::-webkit-details-marker{display:none}
details.more summary .lucide{width:14px;height:14px;color:var(--ink-3);transition:transform .18s}
details.more[open] summary .lucide{transform:rotate(90deg)}
details.more .more-body{padding-top:18px}
.switch-row{display:flex;align-items:center;gap:11px;border:1px solid var(--border);border-radius:9px;padding:11px 12px}
.switch-row .t1{font-weight:500;font-size:13.5px}
.switch-row .t2{font-size:12px;color:var(--ink-3);margin-top:2px}
.form-actions{display:flex;justify-content:flex-end;gap:9px;padding-top:16px;border-top:1px solid var(--border)}
.prev-col{position:sticky;top:calc(var(--topbar-h) + 26px)}
.prev-lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.prev-col .prod-card{cursor:default}
.prev-col .prod-card:hover{box-shadow:var(--shadow-card)}
.prod-ic img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}

/* ---------- Drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(23,28,48,.32);z-index:60;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}}
.closing .overlay{animation:fadeOut .2s forwards}
@keyframes fadeOut{to{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(442px,100vw);background:#fff;z-index:61;
  box-shadow:-12px 0 40px rgba(15,25,50,.16);display:flex;flex-direction:column;
  animation:slideIn .3s cubic-bezier(.32,.72,.24,1)}
@keyframes slideIn{from{transform:translateX(100%)}}
.closing .drawer{animation:slideOut .22s ease forwards}
@keyframes slideOut{to{transform:translateX(100%)}}
.dw-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;
  color:var(--ink-3);font-size:13px;font-weight:500;flex-shrink:0}
.dw-head-l{display:flex;align-items:center;gap:6px}
.back-btn{display:inline-flex;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;color:var(--ink-2)}
.back-btn:hover{background:var(--bg)}
.back-btn .lucide{width:15px;height:15px}
.dw-body{flex:1;overflow-y:auto;padding:22px 24px}
.dw-title{font-size:17.5px;font-weight:600;letter-spacing:-.01em}
.dw-idrow{display:flex;align-items:center;gap:7px;margin-top:7px;color:var(--ink-3)}
.dw-idrow .copy{display:inline-flex;padding:3px;border-radius:5px;color:var(--ink-3)}
.dw-idrow .copy:hover{background:var(--bg);color:var(--ink-2)}
.dw-idrow .copy .lucide{width:13px;height:13px}
.dw-amount-row{display:flex;align-items:center;gap:12px;margin:20px 0 4px}
.dw-amount{font-size:31px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.notice{padding:12px 14px;border-radius:8px;font-size:13.5px;display:flex;gap:10px;line-height:1.5;margin:16px 0}
.notice .lucide{width:15px;height:15px;margin-top:2px}
.notice-red{background:var(--red-b);color:#8d1d43}
.notice-amber{background:var(--amber-b);color:#7c4a08}
.notice-gray{background:var(--bg);color:var(--ink-2)}
.dw-sec{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 12px}
.timeline{display:flex;flex-direction:column}
.tl-item{display:flex;gap:13px;position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:2px}
.tl-item::before{content:'';position:absolute;left:5.5px;top:14px;bottom:-2px;width:2px;background:var(--border-soft)}
.tl-item:last-child::before{display:none}
.tl-dot{width:13px;height:13px;border-radius:50%;border:2px solid #c6cdd8;background:#fff;flex-shrink:0;margin-top:2px;z-index:1}
.tl-dot.ok{border-color:var(--green-t);background:var(--green-b)}
.tl-dot.warn{border-color:#d9a13c;background:var(--amber-b)}
.tl-dot.bad{border-color:var(--red-t);background:var(--red-b)}
.tl-title{font-weight:600;font-size:13.5px}
.tl-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.kv{display:grid;grid-template-columns:128px 1fr;row-gap:11px;column-gap:14px;font-size:13.5px}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:500}
.kv .v .sub-v{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:1px}
.dw-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;flex-wrap:wrap}
.confirm-strip{display:flex;align-items:center;gap:10px;font-size:13.5px;flex-wrap:wrap;width:100%;justify-content:flex-end}
.dw-hero{display:flex;align-items:center;gap:14px;margin-bottom:6px}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:#20263e;color:#fff;padding:10px 15px;border-radius:9px;font-size:13.5px;display:flex;gap:9px;
  align-items:center;box-shadow:0 8px 24px rgba(10,15,40,.3);animation:toastIn .25s cubic-bezier(.2,.9,.3,1.2)}
.toast .lucide{width:15px;height:15px;color:#9f97ff}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* ---------- Charts ---------- */
.aline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:dash .9s ease .05s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.aarea{fill:var(--accent);opacity:0;animation:fadeA .5s ease .35s forwards}
.aarea-fade{fill:url(#areaFade)}
.pline{fill:none;stroke:#a5aec0;stroke-width:1.6;stroke-dasharray:5 4;opacity:0;animation:fadeLine .4s ease .5s forwards}
.grid-l{stroke:var(--border-soft)}
.ax-t{fill:var(--ink-3);font-size:11px;font-family:'Instrument Sans',sans-serif}
.cross{stroke:#b9c0cf;stroke-width:1;stroke-dasharray:3 3}
@keyframes fadeA{to{opacity:.07}}
@keyframes fadeLine{to{opacity:.9}}
#sb-backdrop{display:none}

/* ---------- Responsive ---------- */
@media(max-width:1080px){
  .ov-grid{grid-template-columns:1fr}
  .rail{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .form-grid{grid-template-columns:1fr}
  .prev-col{position:static;max-width:340px}
}
@media(max-width:920px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:90;background:var(--bg);transform:translateX(-105%);
    transition:transform .25s ease;box-shadow:8px 0 40px rgba(15,25,50,.12)}
  .tb-brand{width:auto}
  body.sb-open #sidebar{transform:none}
  body.sb-open #sb-backdrop{display:block;position:fixed;inset:0;background:rgba(23,28,48,.32);z-index:85}
  #menu-btn{display:flex}
  .tb-section{display:none}
}
@media(max-width:900px){th.c-id,td.c-id{display:none}}
@media(max-width:860px){
  .snap{grid-template-columns:1fr 1fr}
  .snap-cell:nth-child(3){border-left:none}
  .snap-cell:nth-child(3),.snap-cell:nth-child(4){border-top:1px solid var(--border-soft)}
  .bar-val{display:none}
  .rail{grid-template-columns:1fr}
  .stat-grid,.stat-grid.cols4{grid-template-columns:1fr 1fr}
  #view{padding:20px 16px 56px}
  th.c-desc,td.c-desc,th.c-cust,td.c-cust{display:none}
  #gs-wrap kbd{display:none}
}
@media(max-width:600px){
  .snap{grid-template-columns:1fr}
  .snap-cell{border-left:none;border-top:1px solid var(--border-soft)}
  .snap-cell:first-child{border-top:none}
  .choice,.row2.even{grid-template-columns:1fr}
  .stat-grid,.stat-grid.cols4{grid-template-columns:1fr}
  th.c-method,td.c-method{display:none}
  .test-chip{display:none}
}
</style>

/* Hoisted so it can be called from buildTx() below regardless of section order */
function daysFromNow(h){ return new Date(NOW - h*3600e3); }

const jitter = i => 1 + ((Math.imul(i + 7, 2654435761) >>> 16) % 1000 - 500) / 500 * 0.16;

function buildDaily(weekly, shape){
  const k = 7 / shape.reduce((a,b)=>a+b, 0);
  const start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate() - 195);
  while (start.getDay() !== 1) start.setDate(start.getDate() - 1);
  const today = new Date(); today.setHours(0,0,0,0);
  const values = [], dates = [];
  for (let i = 0; ; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (d > today) break;
    const w = Math.min(weekly.length - 1, Math.floor(i / 7));
    values.push(weekly[w] * shape[(d.getDay() + 6) % 7] * k * jitter(i));
    dates.push(d);
  }
  return { v: values, d: dates };
}

/* Transactions ledger: charges + refunds + payouts.
   Built fresh on every render so refunds/retries stay in sync. */
function buildTx(){
  const out = [];
  PAYMENTS.forEach(p => {
    out.push({ ts:p.ts, type:'charge', id:p.id, desc:p.desc, amount:p.amount, fee:p.fee,
               net:p.amount - p.fee, currency:p.currency, status:p.status, ref:p.id });
    if (p.status === 'refunded')
      out.push({ ts:p.refundedAt, type:'refund', id:'re_' + p.id.slice(6), desc:'Refund — ' + p.desc,
                 amount:-p.amount, fee:0, net:-p.amount, currency:p.currency, status:'refunded', ref:p.id });
  });
  DATA.payouts.forEach(po => {
    out.push({ ts:daysFromNow(po.created_age_h).getTime(), type:'payout', id:po.id,
               desc:'Payout to bank account •••• 6789', amount:-po.amount, fee:0, net:-po.amount,
               currency:po.currency, status:po.status, ref:null });
  });
  return out.sort((a,b) => b.ts - a.ts);
}

/* Customers derived from payments */
function getCustomers(){
  const by = {};
  PAYMENTS.forEach(p => {
    const c = by[p.email] || (by[p.email] = { name:p.name, email:p.email, count:0, spend:0, failed:0, first:Infinity, last:0 });
    c.count++; c.first = Math.min(c.first, p.ts); c.last = Math.max(c.last, p.ts);
    if (p.status === 'succeeded') c.spend += p.amount;
    if (p.status === 'failed') c.failed++;
  });
  return Object.values(by).sort((a,b) => b.spend - a.spend);
}

function fago(ts){
  const m = Math.round((nowTs()-ts)/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + (m===1?' minute':' minutes') + ' ago';
  const h = Math.round(m/60);
  if (h < 48) return h + (h===1?' hour':' hours') + ' ago';
  const d = Math.round(h/24);
  return d + (d===1?' day':' days') + ' ago';
}

const deltaHtml = (cur, prev, label) => {

function sparkSvg(vals, w=118, h=40){
  const min = Math.min(...vals), max = Math.max(...vals), span = (max-min)||1;
  const px = i => 2 + i*(w-6)/(vals.length-1);
  const py = v => 3 + (1-(v-min)/span)*(h-8);
  const pts = vals.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  const last = vals[vals.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="flex-shrink:0;margin-top:8px">
    <polyline class="aline" pathLength="1" points="${pts}"/>
    <circle cx="${px(vals.length-1).toFixed(1)}" cy="${py(last).toFixed(1)}" r="2.6" fill="#635bff"/>
  </svg>`;
}

/* ---------------------------------------------------------
   Daily & weekly aggregation
   SERIES.volume/.customers are one contiguous run of days
   ending today, so an index is just an offset from today.
   --------------------------------------------------------- */
const DAYS = SERIES.volume.d.map((d, i) => ({ d, vol: SERIES.volume.v[i], cus: SERIES.customers.v[i] }));
const LAST = DAYS.length - 1;
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const idxOf = date => LAST - Math.round((DAYS[LAST].d - startOfDay(date)) / 864e5);
const dayAt = i => DAYS[i] || { d: DAYS[0].d, vol:0, cus:0 };
const sumDays = (a, b) => DAYS.slice(Math.max(0,a), Math.max(0,b))
  .reduce((t, x) => ({ vol: t.vol + x.vol, cus: t.cus + x.cus }), { vol:0, cus:0 });

/* How much of today has actually elapsed — today's bucket is prorated by this
   so a partial day never reads as a collapse in volume. */
const dayFrac = () => {
  const n = new Date();
  return Math.min(1, Math.max(.05, (n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds()) / 86400));
};

const pctDelta = (cur, prev) => prev ? (cur - prev) / prev * 100 : 0;
const deltaChip = (cur, prev) => {
  if (!prev) return '<span style="color:var(--ink-3)">—</span>';
  const pct = pctDelta(cur, prev), up = pct >= 0;
  return `<span class="delta ${up?'up':'down'}"><i data-lucide="${up?'arrow-up-right':'arrow-down-right'}"></i>${Math.abs(pct).toFixed(1)}%</span>`;
};

/* Week to date against the *same days* of the week before — scaling a whole
   prior week by elapsed time would flatter the comparison, since weekends
   carry far less volume than Mon–Thu. */
function weekToDate(){
  const frac = dayFrac(), today = DAYS[LAST];
  const dow = (today.d.getDay() + 6) % 7;      /* 0 = Monday */
  const wStart = LAST - dow;
  const part = v => v * (1 - frac);
  return {
    dow, wStart,
    vol:  sumDays(wStart, LAST + 1).vol - part(today.vol),
    cus:  sumDays(wStart, LAST + 1).cus - part(today.cus),
    prev: sumDays(wStart - 7, wStart - 7 + dow + 1).vol - part(dayAt(LAST - 7).vol)
  };
}

function snapshotCells(){
  const frac = dayFrac();
  const today = DAYS[LAST];
  const dom = today.d.getDate();
  const part = v => v * (1 - frac);            /* the not-yet-happened slice of a day */

  const w = weekToDate(), { dow, wStart } = w;
  const wtd = w.vol, pwtd = w.prev;

  const mStart = LAST - dom + 1;
  const mtd = sumDays(mStart, LAST + 1).vol - part(today.vol);
  const prevMonthDays = new Date(today.d.getFullYear(), today.d.getMonth(), 0).getDate();
  const pmFirst = new Date(today.d.getFullYear(), today.d.getMonth() - 1, 1);
  const pmLast  = new Date(today.d.getFullYear(), today.d.getMonth() - 1, Math.min(dom, prevMonthDays));
  const pmtd = sumDays(idxOf(pmFirst), idxOf(pmLast) + 1).vol;

  return [
    { lbl:'Today so far',  val: today.vol * frac,   prev: dayAt(LAST-7).vol * frac,
      note:'vs. same point last week',
      sub: today.d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}),
      cus: dayAt(LAST).cus * frac },
    { lbl:'Yesterday',     val: dayAt(LAST-1).vol,  prev: dayAt(LAST-8).vol,
      note:'vs. same day last week',
      sub: fdate(dayAt(LAST-1).d),
      cus: dayAt(LAST-1).cus },
    { lbl:'Week to date',  val: wtd,                prev: pwtd,
      note:'vs. last week',
      sub: `${fdate(dayAt(wStart).d)} – ${fdate(today.d)}`,
      cus: w.cus },
    { lbl:'Month to date', val: mtd,                prev: pmtd,
      note:'vs. last month',
      sub: fmonth(today.d),
      cus: sumDays(mStart, LAST+1).cus - part(today.cus) }
  ];
}

/* ---- Daily / weekly buckets ---- */
function grainBuckets(){
  const frac = dayFrac();
  let out;

  if (state.grain === 'weekly'){
    const w = weekToDate();
    out = [];
    let end = LAST + 1, start = end - 1 - w.dow;
    for (let i = 0; i < 12 && start > 0; i++){
      const seg = sumDays(start, end);
      const first = dayAt(Math.max(0, start)).d, last = dayAt(end - 1).d;
      const partial = i === 0;
      out.unshift({
        label: first.toLocaleDateString('en-US',{month:'short',day:'numeric'}),
        short: `${fdate(first)} – ${fdate(last)}`,
        sub:   `${fdate(first)} – ${fdate(last)}`,
        vol:   partial ? w.vol : seg.vol,
        cus:   partial ? w.cus : seg.cus,
        partial
      });
      end = start; start = end - 7;
    }
  } else {
    out = DAYS.slice(-14).map((x, i, arr) => {
      const partial = i === arr.length - 1;
      return {
        label: x.d.toLocaleDateString('en-US',{weekday:'short'}),
        short: fdate(x.d),
        sub:   x.d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}),
        vol:   partial ? x.vol * frac : x.vol,
        cus:   partial ? x.cus * frac : x.cus,
        partial
      };
    });
  }

  /* cmp = what this bucket is measured against: the bucket before it, or for
     the one still in progress, the same elapsed share of the bucket before it. */
  out.forEach((b, i) => { b.cmp = i ? out[i-1].vol : null; });
  const cur = out[out.length - 1];
  if (cur && cur.partial && out.length > 1)
    cur.cmp = state.grain === 'weekly' ? weekToDate().prev : dayAt(LAST - 1).vol * frac;
  return out;
}

function niceCeil(v){
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v/mag;
  const nice = norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10;
  return nice*mag;
}
function drawBigChart(){
  const el = $('#big-chart'); if(!el) return;
  const n = RANGE_N[state.range];
  const s = rangeStats(n);
  const dates = SERIES.volume.d.slice(-n);
  const cur = s.cur.map(v=>v*FEE_RATE), prev = s.prev;
  const W = Math.max(320, el.clientWidth), H = 262, pL=52, pR=10, pT=12, pB=26;
  const max = niceCeil(Math.max(...cur, ...prev)*1.06);
  const X = i => pL + i*(W-pL-pR)/(cur.length-1);
  const Y = v => pT + (1 - v/max)*(H-pT-pB);
  const line = a => a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const area = line(cur) + `L${X(cur.length-1).toFixed(1)},${(H-pB)}L${pL},${(H-pB)}Z`;
  let grid='';
  for(let i=0;i<=4;i++){
    const val = max*i/4, y = Y(val);
    grid += `<line class="grid-l" x1="${pL}" x2="${W-pR}" y1="${y}" y2="${y}"/>
             <text class="ax-t" x="${pL-8}" y="${y+3.5}" text-anchor="end">${i===0?'$0':moneyK(val)}</text>`;
  }
  const step = Math.max(1, Math.ceil(cur.length/6));
  let ax='';
  for(let i=0;i<cur.length;i+=step) ax += `<text class="ax-t" x="${X(i)}" y="${H-8}" text-anchor="middle">${fdate(dates[i])}</text>`;

  el.innerHTML = `
    <svg id="bc-svg" width="${W}" height="${H}" style="display:block">
      <defs><linearGradient id="areaFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#635bff" stop-opacity=".10"/><stop offset="1" stop-color="#635bff" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}${ax}
      <path class="aarea aarea-fade" d="${area}"/>
      <path class="pline" d="${line(prev)}"/>
      <path class="aline" pathLength="1" d="${line(cur)}"/>
      <line id="bc-cross" class="cross" y1="${pT}" y2="${H-pB}" style="display:none"/>
      <circle id="bc-dot" r="4" fill="#fff" stroke="#635bff" stroke-width="2.5" style="display:none"/>
      <rect x="${pL}" y="${pT}" width="${W-pL-pR}" height="${H-pT-pB}" fill="transparent" id="bc-ov"/>
    </svg>
    <div class="chart-tip" id="bc-tip"></div>`;

  const svg=$('#bc-svg'), ov=$('#bc-ov'), cross=$('#bc-cross'), dot=$('#bc-dot'), tip=$('#bc-tip');
  ov.addEventListener('mousemove', e=>{
    const r = svg.getBoundingClientRect();
    const mx = e.clientX - r.left;
    const i = Math.max(0, Math.min(cur.length-1, Math.round((mx-pL)/((W-pL-pR)/(cur.length-1)))));
    cross.style.display='block'; dot.style.display='block';
    cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i));
    dot.setAttribute('cx',X(i)); dot.setAttribute('cy',Y(cur[i]));
    tip.style.display='block';
    tip.innerHTML = `<b>${money0(cur[i])}</b><br>${fdatetime(dates[i].getTime())}<br><span class="pv">Prev period: ${money0(prev[i])}</span>`;
    const tw = tip.offsetWidth;
    tip.style.left = (X(i) + 14 + tw > W ? X(i)-tw-14 : X(i)+14) + 'px';
    tip.style.top  = Math.max(4, Y(cur[i])-20) + 'px';
  });
  ov.addEventListener('mouseleave', ()=>{ cross.style.display='none'; dot.style.display='none'; tip.style.display='none'; });
}

/* =========================================================

   ========================================================= */
const PAGE_SIZE = 10;

function visiblePayments(){
  let list = PAYMENTS.slice();
  const { q, status, sortKey, sortDir } = state.pay;
  if (q){
    const s = q.toLowerCase();
    list = list.filter(p =>
      p.desc.toLowerCase().includes(s) || p.name.toLowerCase().includes(s) ||
      p.email.toLowerCase().includes(s) || p.id.toLowerCase().includes(s) ||
      money(p.amount, p.currency).toLowerCase().includes(s));
  }
  if (status !== 'all') list = list.filter(p => p.status === status);
  list.sort((a,b) => (a[sortKey] - b[sortKey]) * (sortDir==='asc' ? 1 : -1));
  return list;
}

function payToolbarHtml(){
  const { q, status } = state.pay;
  return `
    <div class="toolbar">
      <div class="pt-search"><i data-lucide="search"></i>
        <input id="pay-q" type="text" placeholder="Search by description, customer, ID…" value="${esc(q)}" spellcheck="false">
      </div>
      <div class="pillset">
        ${['all','succeeded','pending','failed','refunded'].map(s=>{
          const cnt = s==='all' ? PAYMENTS.length : PAYMENTS.filter(p=>p.status===s).length;
          return `<button class="pill ${status===s?'active':''}" data-st="${s}">${s[0].toUpperCase()+s.slice(1)}<span class="cnt">${cnt}</span></button>`;
        }).join('')}
      </div>
      <span style="flex:1"></span>
      <button class="btn btn-secondary" id="export-btn"><i data-lucide="download"></i>Export</button>
    </div>`;
}

function payBodyHtml(){
  const all = visiblePayments();
  const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  state.pay.page = Math.min(state.pay.page, pages);
  const { sortKey, sortDir } = state.pay;
  const start = (state.pay.page-1)*PAGE_SIZE;
  const rows = all.slice(start, start + PAGE_SIZE);

  const group = sortKey==='ts' && sortDir==='desc';
  let body = '', lastDay = null;
  rows.forEach(p => {
    if (group){
      const key = new Date(p.ts).toDateString();
      if (key !== lastDay){
        lastDay = key;
        const d = new Date(p.ts), t = new Date();
        const diff = Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
        const lbl = diff===0 ? 'Today' : diff===1 ? 'Yesterday' : d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
        body += `<tr class="group-row"><td colspan="7">${lbl}</td></tr>`;
      }
    }
    body += `<tr class="p-row ${state.sel===p.id?'selected':''}" data-open-pay="${p.id}">
      <td class="amount">${money(p.amount,p.currency)}</td>
      <td>${stPill(p.status)}</td>
      <td class="c-desc">${esc(p.desc)}</td>
      <td class="c-method method-cell">${brandSvg(p.brand)}•••• ${p.last4}</td>
      <td class="c-cust cust-cell">${esc(p.name)}</td>
      <td class="date-cell">${fdatetime(p.ts)}</td>
      <td><i data-lucide="chevron-right" class="lucide"></i></td>
    </tr>`;
  });

  const sortIcon = key => sortKey!==key ? '' : `<i data-lucide="${sortDir==='desc'?'chevron-down':'chevron-up'}"></i>`;

  if (!all.length) return `<div class="empty">
      <div class="ring"><i data-lucide="inbox" style="width:20px;height:20px"></i></div>
      <h3>No payments found</h3><p>Nothing matches your current filters.</p>
      <button class="btn btn-secondary" id="clear-filters">Clear filters</button>
    </div>`;

  return `
    <table class="pay">
      <thead><tr>
        <th class="sortable" data-sort="amount">Amount${sortIcon('amount')}</th>
        <th>Status</th>
        <th class="c-desc">Description</th>
        <th class="c-method">Method</th>
        <th class="c-cust">Customer</th>
        <th class="sortable" data-sort="ts">Date${sortIcon('ts')}</th>
        <th></th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>
    ${pagerHtml(state.pay.page, pages, `Showing ${start+1}–${Math.min(start+PAGE_SIZE, all.length)} of ${all.length} payments`)}`;
}

function wirePayTable(){
  $$('#pay-body [data-open-pay]').forEach(r => r.addEventListener('click', () => {

  $$('#pay-body [data-pg]').forEach(b => b.addEventListener('click', () => {

function exportCsv(){
  const rows = visiblePayments();
  const head = 'id,created,status,currency,amount,fee,net,description,customer,card';
  const body = rows.map(p => [
    p.id, new Date(p.ts).toISOString(), p.status, p.currency,
    (p.amount/100).toFixed(2), (p.fee/100).toFixed(2), ((p.amount-p.fee)/100).toFixed(2),
    p.desc, p.email, `${p.brand} ${p.last4}`
  ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');

function txVisible(){

function txBodyHtml(){

  if (!all.length) return `<div class="empty">
    <div class="ring"><i data-lucide="inbox" style="width:20px;height:20px"></i></div>
    <h3>No transactions found</h3><p>Nothing matches your current filters.</p>

  </div>`;

  const groups = [];

  rows.forEach(t => {
    const k = fmonth(t.ts);
    if (!cur || cur.k !== k){ cur = { k, items:[], net:0 }; groups.push(cur); }
    cur.items.push(t); cur.net += t.net;
  });

  const body = groups.map(g => `
    <tr class="group-row"><td colspan="7">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span>${g.k}</span><span style="font-weight:600;color:var(--ink-2)">${signed(g.net)}</span>
      </div></td></tr>
    ${g.items.map(t => {
      const tt = TX_TYPE[t.type];
      let status;
      if (t.type === 'charge') status = stPill(t.status);
      else if (t.type === 'refund') status = stPillMeta('Refunded', STATUS.refunded.c, STATUS.refunded.b);
      else status = t.status === 'paid' ? stPillMeta('Paid','#217005','#e0f2d3') : stPillMeta('In transit','#0b6bb8','#dff0fb');
      const cls = t.ref ? 'p-row' : 'tx-static';
      const open = t.ref ? ` data-open-pay="${t.ref}"` : '';
      return `<tr class="${cls}"${open}>
        <td class="date-cell">${fdate(t.ts)}</td>
        <td>${stPillMeta(tt.label, tt.c, tt.b)}</td>
        <td class="c-desc">${esc(t.desc)}</td>
        <td class="c-id id-cell">${t.id}</td>
        <td class="amount">${signed(t.amount, t.currency)}${t.type==='charge'?`<span class="tx-fee">incl. ${money(t.fee,t.currency)} fee</span>`:''}</td>
        <td>${signed(t.net, t.currency)}</td>
        <td>${t.ref ? '<i data-lucide="chevron-right" class="lucide"></i>' : ''}</td>
      </tr>`;
    }).join('')}`).join('');

  return `
    <table class="pay">
      <thead><tr><th>Date</th><th>Type</th><th class="c-desc">Description</th><th class="c-id">ID</th><th>Amount</th><th>Net</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    ${pagerHtml(state.tx.page, pages, `Showing ${start+1}–${Math.min(start+PAGE_SIZE_TX, all.length)} of ${all.length} transactions`)}`;
}

function priceLine(pc, withId){
  const per = pc.type === 'recurring' ? `<span class="per">per ${pc.interval}</span>` : '';
  const trial = pc.trial ? `<span class="per">· ${pc.trial}-day trial</span>` : '';
  const badge = `<span class="type-badge">${pc.type === 'recurring' ? 'Recurring' : 'One-time'}</span>`;
  const core = `<span class="amt">${money(pc.amount, pc.cur)}</span>${per}${trial}`;
  if (!withId) return `<div class="price-row"><div>${core}</div>${badge}</div>`;
  return `<div class="price-row">
    <div style="min-width:0"><div>${core}</div>
      ${pc.nick ? `<div style="font-size:12px;color:var(--ink-3);margin-top:2px">${esc(pc.nick)}</div>` : ''}
      <div class="mono" style="font-size:11px;color:var(--ink-3)">${pc.id}</div></div>
    ${badge}</div>`;
}

/* One product card — shared by the grid and by the new-product preview */
function prodMedia(p, size){
  const s = size || 38, r = s >= 46 ? 11 : 9;

  if (p.image) return `<div class="prod-ic" style="${box}"><img src="${esc(p.image)}" alt=""></div>`;
  return `<div class="prod-ic" style="${box};background:${p.tint[0]};color:${p.tint[1]}">
    <i data-lucide="${p.icon}" style="width:${Math.round(s*.47)}px;height:${Math.round(s*.47)}px"></i></div>`;
}

function prodCardHtml(p, st, opts = {}){

   ========================================================= */
const CURRENCIES = [
  { code:'usd', sym:'$' }, { code:'eur', sym:'€' }, { code:'gbp', sym:'£' },
  { code:'cad', sym:'$' }, { code:'aud', sym:'$' }
];
const INTERVALS = [
  { v:'day',    label:'Daily',           count:1, unit:'day'   },
  { v:'week',   label:'Weekly',          count:1, unit:'week'  },
  { v:'month',  label:'Monthly',         count:1, unit:'month' },
  { v:'3month', label:'Every 3 months',  count:3, unit:'month' },
  { v:'6month', label:'Every 6 months',  count:6, unit:'month' },
  { v:'year',   label:'Yearly',          count:1, unit:'year'  }
];
const PROD_ICONS = ['package','sparkles','zap','pen-tool','layout-template','graduation-cap',
                    'type','puzzle','palette','rocket','box','wrench'];
const PROD_TINTS = [['#eceaff','#4638cf'], ...TINTS];
const TAX_MODES = [
  { v:'exclusive', label:'Exclusive — tax added at checkout' },
  { v:'inclusive', label:'Inclusive — tax included in the price' },
  { v:'unspecified', label:'Unspecified' }
];

const curSym = c => (CURRENCIES.find(x => x.code === c) || CURRENCIES[0]).sym;
const intervalMeta = v => INTERVALS.find(i => i.v === v) || INTERVALS[2];
const intervalLabel = v => { const m = intervalMeta(v); return m.count === 1 ? m.unit : `${m.count} ${m.unit}s`; };
const toCents = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g,'')); return Number.isFinite(n) ? Math.round(n*100) : NaN; };
const toDays  = v => { const n = parseInt(String(v).replace(/[^0-9]/g,''), 10); return Number.isFinite(n) ? n : 0; };
