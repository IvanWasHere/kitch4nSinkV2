#
# The documentation site, built from this folder by .github/workflows/deploy-docs.yml.
#
# GitHub Pages builds with the `github-pages` gem (Jekyll 3.10), which allows a
# fixed set of plugins and `remote_theme`. The theme is pinned to a tag so a
# release upstream cannot change the site on its own.
#
# `url` and `baseurl` are filled in by actions/configure-pages at build time,
# so they are deliberately absent here — setting them by hand is what usually
# breaks stylesheets on a project site.
#
title: Multi-tenant SaaS Starter
description: >-
  Documentation for a multi-tenant SaaS starter built on AdonisJS 6 — tenancy,
  billing, plan limits, an API, files, support and a staff back office.

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Every page gets the theme's layout, so a new file needs only a title and a
# place in the nav.
defaults:
  - scope:
      path: ''
    values:
      layout: default

logo: /logo.svg
search_enabled: true
search:
  heading_level: 3
  previews: 2

heading_anchors: true
color_scheme: light

# The repository, and the long-form documents that stay in it rather than
# becoming pages here.
aux_links:
  On GitHub:
    - https://github.com/IvanWasHere/kitch4nSinkV2
aux_links_new_tab: true

back_to_top: true
back_to_top_text: Back to top

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Careful
    color: red

# Jekyll would otherwise try to build these as pages.
exclude:
  - .jekyll-cache
